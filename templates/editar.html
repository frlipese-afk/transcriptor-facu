<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Transcripción</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; color: #1a1a1a; }
        .container { max-width: 800px; margin: 20px auto; }
        .card { background: white; border-radius: 16px; padding: 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h1 { font-size: 24px; color: #333; margin-top: 0; text-align: center; }
        h3 { margin-top: 0; color: #333; font-size: 18px; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px; }
        .titulo-input { width: 100%; font-size: 18px; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-weight: bold; }
        audio { width: 100%; margin-bottom: 20px; border-radius: 12px; }
        
        /* La caja editable mágica */
        .editor-box { 
            height: 450px; 
            overflow-y: auto; 
            background: #fafafa; 
            border: 1px solid #ccc; 
            padding: 15px; 
            border-radius: 8px; 
            font-size: 16px; 
            line-height: 1.6; 
            color: #333; 
        }
        .editor-box:focus { outline: none; border-color: #007bff; background: #fff; }
        
        /* Cada línea de texto */
        .linea { margin-bottom: 8px; }
        .minuto { 
            color: #007bff; 
            cursor: pointer; 
            font-weight: bold; 
            background: #e7f1ff; 
            padding: 2px 8px; 
            border-radius: 6px; 
            margin-right: 8px; 
            font-size: 14px; 
            display: inline-block; /* Para que quede al lado del texto */
            user-select: none; /* Para que no lo seleccionen al editar */
        }
        .minuto:hover { background: #007bff; color: white; }
        .texto-editable { display: inline; } /* El texto fluye al lado del minutito */
        
        .btn { display: inline-block; padding: 12px 24px; font-size: 16px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; text-decoration: none; margin-top: 20px; }
        .btn-success { background: #28a745; color: white; }
        .btn-secondary { background: #e9ecef; color: #666; margin-left: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>✏️ Editor de Transcripción</h1>
            <audio id="reproductor" controls src="{{ nota.audio_url }}"></audio>
            
            <form id="form-edicion" action="/guardar-edicion/{{ nota.id }}?email={{ email }}" method="post">
                <input type="hidden" name="email" value="{{ email }}">
                <input type="text" name="titulo" value="{{ nota.titulo }}" class="titulo-input" required>
                
                <h3>📝 Texto (Editá lo que necesites corregir)</h3>
                <!-- El input oculto que guarda el texto para enviarlo -->
                <input type="hidden" name="texto" id="texto-oculto">
                
                <!-- La caja editable mágica. El 'contenteditable' hace que se pueda escribir acá -->
                <div class="editor-box" contenteditable="true" id="caja-texto">
                    {{ nota.texto_html | safe }}
                </div>

                <div style="text-align: right;">
                    <button type="submit" class="btn btn-success">💾 Guardar Cambios</button>
                    <a href="/historial?email={{ email }}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>

        <script>
        function saltarA(segundos) {
            const audio = document.getElementById('reproductor');
            audio.currentTime = segundos;
            audio.play();
        }

        const cajaTexto = document.getElementById('caja-texto');

        cajaTexto.addEventListener('keydown', function(e) {
            const sel = window.getSelection();
            if (!sel.rangeCount) return;
            const range = sel.getRangeAt(0);

            // 1. Bloquear Enter siempre
            if (e.key === 'Enter') {
                e.preventDefault();
                return;
            }

            const isActionKey = e.key === 'Backspace' || e.key === 'Delete';
            const isTyping = e.key.length === 1; 

            // 2. Si hay texto seleccionado (resaltado en azul)
            if (!sel.isCollapsed) {
                if (isActionKey || isTyping) {
                    const minutes = document.querySelectorAll('.minuto');
                    for (let i = 0; i < minutes.length; i++) {
                        if (range.intersectsNode(minutes[i])) {
                            e.preventDefault();
                            return;
                        }
                    }
                }
            } else {
                // 3. Si NO hay texto seleccionado (solo el cursor parpadeando)
                let container = range.startContainer;
                let parent = container.nodeType === 3 ? container.parentElement : container;

                // ZONA DE SEGURIDAD: Si intentan escribir o borrar
                if (isTyping || isActionKey) {
                    // Si el cursor NO está adentro de un 'texto-editable', bloqueamos TODAS las teclas
                    if (!parent.classList.contains('texto-editable')) {
                        e.preventDefault();
                        return;
                    }

                    // Si están adentro del texto, revisamos los bordes para que no se coman el minutito
                    if (e.key === 'Backspace' && range.startOffset === 0) {
                        e.preventDefault(); // Bloquea borrar hacia atrás si está en el inicio
                        return;
                    }
                    if (e.key === 'Delete') {
                        if (container.nodeType === 3 && range.startOffset === container.length) {
                            e.preventDefault(); // Bloquea suprimir si está en el final del texto
                            return;
                        }
                    }
                }
            }
        });

        // Antes de enviar el formulario, copiamos el texto y lo limpiamos
        document.getElementById('form-edicion').addEventListener('submit', function(e) {
            let texto = cajaTexto.innerText;
            texto = texto.replace(/\n\n/g, '\n').trim();
            document.getElementById('texto-oculto').value = texto;
        });
    </script>
</body>
</html>
