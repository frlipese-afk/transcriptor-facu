<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2563EB" />
  <title>Transcriptor Facu</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --primary: #2563eb; --primary-dark: #1d4ed8; --primary-light: #e8f1ff; --primary-soft: #f4f8ff; --success: #16a34a; --success-dark: #15803d; --danger: #dc2626; --danger-light: #fff1f2; --text: #111827; --text-secondary: #64748b; --background: #f7f9fc; --surface: #ffffff; --border: #e2e8f0; --radius-lg: 22px; --radius-md: 16px; --shadow-sm: 0 4px 16px rgba(15, 23, 42, 0.06); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; background: var(--background); color: var(--text); font-family: "Poppins", sans-serif; font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
    button, input, select { font: inherit; }
    button { border: 0; cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    .topbar { position: sticky; top: 0; z-index: 20; background: rgba(247, 249, 252, 0.92); backdrop-filter: blur(14px); border-bottom: 1px solid rgba(226, 232, 240, 0.8); }
    .topbar-inner { width: min(100% - 32px, 760px); min-height: 64px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; }
    .brand-mark { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 12px; background: var(--primary); color: white; box-shadow: 0 8px 20px rgba(37, 99, 235, 0.22); }
    .brand-text { font-size: 0.98rem; }
    main { width: min(100% - 32px, 760px); margin: 0 auto; padding: 28px 0 100px; }
    .hero { margin-bottom: 24px; }
    .eyebrow { margin-bottom: 4px; color: var(--primary); font-size: 0.82rem; font-weight: 600; }
    h1 { font-size: clamp(1.65rem, 5vw, 2.15rem); font-weight: 700; letter-spacing: -0.025em; }
    .subtitle { margin-top: 7px; color: var(--text-secondary); font-size: 0.92rem; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); padding: 20px; margin-bottom: 16px; }
    .credits-content { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .label { color: var(--text-secondary); font-size: 0.85rem; font-weight: 500; }
    .credits-number { display: block; margin-top: 2px; color: var(--primary); font-size: 2rem; font-weight: 700; }
    .icon-circle { width: 50px; height: 50px; display: grid; place-items: center; border-radius: 50%; background: var(--primary-light); color: var(--primary); }
    .section-heading { margin-bottom: 10px; font-size: 0.9rem; font-weight: 600; }
    .select-wrap select { width: 100%; min-height: 54px; appearance: none; border: 1px solid #cbd5e1; border-radius: var(--radius-md); background: var(--surface); color: var(--text); padding: 0 48px 0 16px; font-size: 0.94rem; font-weight: 500; cursor: pointer; }
    .upload-zone { position: relative; margin-top: 16px; }
    .upload-input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .upload-label { min-height: 172px; padding: 24px 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; border: 1.5px dashed #7aa7ff; border-radius: var(--radius-lg); background: var(--primary-soft); color: var(--text); }
    .upload-icon { width: 54px; height: 54px; display: grid; place-items: center; border-radius: 16px; background: var(--primary-light); color: var(--primary); }
    .btn { min-height: 50px; width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 9px; padding: 12px 18px; border-radius: 14px; font-size: 0.92rem; font-weight: 600; transition: transform 120ms ease; }
    .btn:active { transform: translateY(1px); }
    .btn-primary { margin-top: 16px; background: var(--primary); color: #fff; box-shadow: 0 8px 18px rgba(37, 99, 235, 0.2); }
    .btn-success { background: var(--success); color: white; box-shadow: 0 8px 18px rgba(22, 163, 74, 0.18); }
    .btn-google { background: #fff; color: var(--text); border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
    .login-card { text-align: center; }
    .procesando-box { display: none; margin-top: 20px; padding: 25px; background: var(--primary-light); border-radius: var(--radius-lg); text-align: center; }
    .progress-track { width: 100%; background: #d0e3ff; border-radius: 10px; height: 15px; margin-top: 15px; overflow: hidden; }
    .progress-bar { width: 0%; background: var(--primary); height: 100%; border-radius: 10px; transition: width 0.3s; }
    .bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 8px 16px; background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(16px); border-top: 1px solid var(--border); }
    .bottom-nav-inner { width: min(100%, 760px); margin: 0 auto; display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .nav-item { min-height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 14px; color: var(--text-secondary); background: transparent; font-size: 0.68rem; font-weight: 500; }
    .nav-item.active { color: var(--primary); background: var(--primary-light); font-weight: 600; }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-inner">
        <a href="/" class="brand">
          <span class="brand-mark">🎙️</span>
          <span class="brand-text">Transcriptor Facu</span>
        </a>
      </div>
    </header>

    <main>
      <!-- LOGIN BOX -->
      <div id="login-box" class="card login-card">
        <h1>🎙️ Transcriptor Facu</h1>
        <p class="subtitle">Ingresá para empezar a transcribir tus clases</p>
        <button class="btn btn-google" onclick="loginConGoogle()">Iniciar sesión con Google</button>
      </div>

      <!-- APP BOX -->
      <div id="app-box" style="display: none;">
        <div class="hero">
          <p class="eyebrow">Tu espacio de estudio</p>
          <h1>¡Hola! 👋</h1>
          <p class="subtitle">Transcribí tus clases de forma simple y ordenada.</p>
        </div>

        <article class="card">
          <div class="credits-content">
            <div>
              <span class="label">Créditos disponibles</span>
              <strong class="credits-number" id="creditos">...</strong>
            </div>
            <div class="icon-circle">💰</div>
          </div>
        </article>

        <article class="card">
          <div class="section-heading">Tipo de transcripción</div>
          <div class="select-wrap" style="position:relative;">
            <select name="motor" id="motor-select">
              <option value="groq_turbo">🚀 Rápida (Groq Turbo)</option>
              <option value="groq_normal">🎯 Precisa (Groq Normal)</option>
            </select>
          </div>

          <form id="form-subida" action="/iniciar-transcripcion" method="post" enctype="multipart/form-data" onsubmit="subirAudio(event)">
            <input type="hidden" name="email" id="hidden-email">
            <div class="upload-zone">
              <input id="audio-upload" class="upload-input" type="file" name="audio" accept="audio/*" required />
              <label class="upload-label" for="audio-upload">
                <span class="upload-icon">⬆️</span>
                <span style="font-weight:600;">Subir archivo de audio</span>
                <span style="color:var(--text-secondary); font-size:0.78rem;">MP3, WAV, M4A, etc.</span>
              </label>
            </div>
            <button class="btn btn-primary" type="submit">Subir y Transcribir</button>
          </form>
        </article>

        <div id="procesando-box" class="procesando-box">
          <h3 id="estado-texto" style="margin: 0; color: var(--primary);">⏳ Procesando...</h3>
          <div class="progress-track">
            <div id="barra-carga" class="progress-bar"></div>
          </div>
        </div>
      </div>
    </main>

    <nav class="bottom-nav">
      <div class="bottom-nav-inner">
        <a href="/" class="nav-item active">🏠 Inicio</a>
        <a id="historial-link" href="#" class="nav-item">📚 Historial</a>
      </div>
    </nav>
  </div>

  <script>
    const supabaseUrl = '{{ supabase_url }}';
    const supabaseKey = '{{ supabase_key }}';
    const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);
    
    async function checkUser() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) { mostrarApp(session.user.email); }
    }

    async function loginConGoogle() {
      await supabaseClient.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.origin }
      });
    }

    async function mostrarApp(email) {
      document.getElementById('login-box').style.display = 'none';
      document.getElementById('app-box').style.display = 'block';
      document.getElementById('hidden-email').value = email;
      document.getElementById('historial-link').href = '/historial?email=' + email;
      try {
        let res = await fetch(`https://tfjhtxentxhufvdckkin.supabase.co/rest/v1/usuarios?email=eq.${email}`, {
          headers: { "apikey": supabaseKey }
        });
        let data = await res.json();
        if(data.length > 0) { document.getElementById('creditos').innerText = data[0].creditos; } 
        else { document.getElementById('creditos').innerText = "0"; }
      } catch(e) { document.getElementById('creditos').innerText = "Error"; }
    }

    let intervaloEstado = null;
    async function subirAudio(event) {
      event.preventDefault();
      const form = document.getElementById('form-subida');
      const formData = new FormData(form);
      document.getElementById('app-box').style.display = 'none';
      document.getElementById('procesando-box').style.display = 'block';
      document.getElementById('estado-texto').innerText = '⬆️ Subiendo audio...';
      document.getElementById('barra-carga').style.width = '0%';

      try {
        const response = await fetch('/iniciar-transcripcion', { method: 'POST', body: formData });
        const data = await response.json();
        const jobId = data.job_id;
        intervaloEstado = setInterval(() => chequearEstado(jobId), 1000);
      } catch (e) {
        alert("Error al subir el audio.");
        location.reload();
      }
    }

    async function chequearEstado(jobId) {
      try {
        const res = await fetch(`/estado-transcripcion/${jobId}`);
        const estado = await res.json();
        if (estado.porcentaje) { document.getElementById('barra-carga').style.width = estado.porcentaje + '%'; }
        if (estado.estado === 'cortando') { document.getElementById('estado-texto').innerText = '✂️ Cortando el audio...'; } 
        else if (estado.estado === 'transcribiendo') { document.getElementById('estado-texto').innerText = `🎧 Transcribiendo parte ${estado.actual} de ${estado.total}...`; } 
        else if (estado.estado === 'guardando') { document.getElementById('estado-texto').innerText = '☁️ Guardando en la nube...'; } 
        else if (estado.estado === 'terminado') {
          clearInterval(intervaloEstado);
          document.getElementById('estado-texto').innerText = '✅ ¡Listo! Redirigiendo...';
          setTimeout(() => { window.location.href = `/resultado/${jobId}`; }, 1000);
        } else if (estado.estado === 'error') {
          clearInterval(intervaloEstado);
          document.getElementById('estado-texto').innerText = '❌ Error: ' + estado.mensaje;
        }
      } catch (e) { console.error("Error", e); }
    }

        // Actualizar el texto del botón de subir archivo
    document.getElementById('audio-upload').addEventListener('change', function(e) {
        const uploadLabel = document.querySelector('.upload-label');
        if(e.target.files[0]) {
            uploadLabel.innerHTML = `
                <span class="upload-icon">✅</span>
                <span style="font-weight:600;">${e.target.files[0].name}</span>
                <span style="color:var(--text-secondary); font-size:0.78rem;">Listo para transcribir</span>
            `;
        }
    });

    checkUser();
  </script>
</body>
</html>
